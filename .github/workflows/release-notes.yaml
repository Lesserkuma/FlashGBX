name: Release notes

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-notes-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Generate release notes
        run: |
          awk '/^### / { if (section++) exit; next } section { print }' CHANGES.md > "$RUNNER_TEMP/release-notes.md"
          test -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/release-notes.md")"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
