name: macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  PIP_NO_CACHE_DIR: '1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Prepare temporary directories
        run: |
          printf 'VENV_PATH=%s/flashgbx-venv\nTMPDIR=%s\nPYINSTALLER_CONFIG_DIR=%s/flashgbx-pyinstaller\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m venv "$VENV_PATH"
          source "$VENV_PATH/bin/activate"
          python -m pip install pyinstaller==6.11.0 Pillow==10.3.0 PySide6-Essentials==6.7.2 pyserial==3.5 reedsolo==1.7.0 python-dateutil==2.9.0.post0 requests==2.32.3 packaging==25.0 urllib3==2.7.0 idna==3.19 charset-normalizer==3.5.1 certifi==2026.7.22 six==1.17.0

      - name: Build FlashGBX
        run: |
          cd "${{ github.workspace }}"
          cat > "./FlashGBX.spec" <<'PYINSTALLER_SPEC'
          # -*- mode: python ; coding: utf-8 -*-

          import os

          hiddenimports = [
              'FlashGBX.hw_GBxCartRW',
              'FlashGBX.hw_GBFlash',
              'FlashGBX.hw_JoeyJr',
              'FlashGBX.hw_GameBub',
          ]
          
          a = Analysis(
            ['run.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=hiddenimports,
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            noarchive=False,
          )

          pyz = PYZ(a.pure)
          exe = EXE(
            pyz,
            a.scripts,
            [],
            exclude_binaries=True,
            name='FlashGBX',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            console=False,
            icon=['FlashGBX/res/icon.ico'],
          )
          coll = COLLECT(
            exe,
            a.binaries,
            a.datas,
            strip=False,
            upx=True,
            upx_exclude=[],
            name='FlashGBX',
          )
          info_plist = {
            'CFBundleName': 'FlashGBX',
            'CFBundleDisplayName': 'FlashGBX',
            'CFBundleGetInfoString': 'Interface software for GB/GBC/GBA cart readers',
            'CFBundleShortVersionString': os.environ['VERSION'],
            'CFBundleIdentifier': 'com.lesserkuma.FlashGBX',
          }
          app = BUNDLE(
            coll,
            name='FlashGBX.app',
            icon='FlashGBX/res/icon.ico',
            bundle_identifier='com.lesserkuma.FlashGBX',
            info_plist=info_plist,
          )
          PYINSTALLER_SPEC
          rm -r FlashGBX/config
          source "$VENV_PATH/bin/activate"
          pyinstaller FlashGBX.spec
          mkdir dist/FlashGBX.app/Contents/MacOS/config
          mkdir -p dist/FlashGBX.app/Contents/Resources/res
          mkdir -p dist/FlashGBX.app/Contents/Resources/locale
          cp -R FlashGBX/res/. dist/FlashGBX.app/Contents/Resources/res/
          cp -R FlashGBX/locale/. dist/FlashGBX.app/Contents/Resources/locale/
          ln -s ../Resources/res dist/FlashGBX.app/Contents/MacOS/res
          ln -s ../Resources/locale dist/FlashGBX.app/Contents/MacOS/locale
          
          # Remove unnecessary files
          rm -rf dist/FlashGBX.app/Contents/Resources/PySide6/Qt/lib/Qt{Pdf*,Quick*,Qml*,Network*,OpenGL*,Svg*}.framework*
          rm -rf dist/FlashGBX.app/Contents/Resources/Qt{Pdf*,Quick*,Qml*,Network*,OpenGL*,Svg*}
          rm -rf dist/FlashGBX.app/Contents/Frameworks/PySide6/Qt/lib/Qt{Pdf*,Quick*,Qml*,Network*,OpenGL*,Svg*}.framework*
          rm -rf dist/FlashGBX.app/Contents/Frameworks/Qt{Pdf*,Quick*,Qml*,Network*,OpenGL*,Svg*}
          find dist/FlashGBX.app -path '*/imageformats/*' ! -name '*qico*' -delete
          find dist/FlashGBX.app -path '*/iconengines/*' -delete
          find dist/FlashGBX.app -name 'QtSvg*.so' -delete

      - name: Sign and verify completed bundle
        run: |
          codesign --force --deep --sign - dist/FlashGBX.app
          codesign --verify --deep --strict dist/FlashGBX.app

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p "${{ github.workspace }}/dist/dmg"
          ditto "${{ github.workspace }}/dist/FlashGBX.app" "${{ github.workspace }}/dist/dmg/FlashGBX.app"

          dmg_path="${{ github.workspace }}/dist/FlashGBX-${VERSION}_macOS-${{ matrix.arch }}.dmg"

          max_retries=5
          retry_delay=10

          for attempt in $(seq 1 $max_retries); do
            if create-dmg \
                --volname "FlashGBX" \
                --volicon "${{ github.workspace }}/FlashGBX/res/icon.ico" \
                --window-pos 200 120 \
                --window-size 600 300 \
                --icon-size 100 \
                --icon "FlashGBX.app" 175 120 \
                --hide-extension "FlashGBX.app" \
                --app-drop-link 425 120 \
                "$dmg_path" \
                "${{ github.workspace }}/dist/dmg/"; then
              echo "Successfully created image of FlashGBX v${VERSION}."
              break
            else
              echo "Failed to create DMG (attempt $attempt/$max_retries). Retrying in $retry_delay seconds..."
              sleep $retry_delay
            fi

            if [[ $attempt -eq $max_retries ]]; then
              echo "Error: Failed to create DMG after $max_retries attempts."
              exit 1
            fi
          done
          hdiutil verify "$dmg_path"

      - name: Create artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FlashGBX_macOS-${{ matrix.arch }}
          path: ${{ github.workspace }}/dist/FlashGBX-${{ env.VERSION }}_macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$VERSION" "dist/FlashGBX-${VERSION}_macOS-${{ matrix.arch }}.dmg" --clobber
